name: Continuous Drift Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & CLI
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Download Latest State
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: terraform/generated/
        continue-on-error: true

      - name: Execute SDD Drift Detection
        run: sdd drift --json
