name: SDD-Infra Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'specification/**'
      - 'policies/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'v0.68.0'

      - name: Run Unit Test Suite
        run: python -m pytest tests/ -v

      - name: Load Spec & Compile Resource Plan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "meta-llama/llama-3.1-8b-instruct:free"
        run: |
          python -c "
          from pathlib import Path
          from src.loader import load_spec
          from src.compiler.llm_client import call_llm_for_plan
          from src.compiler.renderer import render_terraform

          spec = load_spec('specification/infrastructure.yaml')
          plan = call_llm_for_plan(spec)
          hcl = render_terraform(plan)

          gen_dir = Path('terraform/generated')
          gen_dir.mkdir(parents=True, exist_ok=True)
          (gen_dir / 'main.tf').write_text(hcl)
          "

      - name: Terraform Init & Validate
        run: |
          cd terraform/generated
          terraform init -no-color
          terraform validate -no-color

      - name: Terraform Plan
        run: |
          cd terraform/generated
          terraform plan -no-color -out=tfplan
          terraform show -json tfplan > plan.json

      - name: OPA Security Policy Gate
        run: |
          python -c "
          from src.policy_runner import evaluate_policy
          allow, violations = evaluate_policy('terraform/generated/plan.json', 'policies')
          if not allow:
              print('Policy gate DENIED execution:')
              for v in violations:
                  print(f' - {v}')
              exit(1)
          print('Policy gate PASSED.')
          "

      - name: Upload Terraform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-build-artifacts
          path: terraform/generated/

  apply:
    needs: compile-and-validate
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform-build-artifacts
          path: terraform/generated/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Terraform Apply
        run: |
          cd terraform/generated
          terraform apply -input=false -no-color tfplan

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/generated/terraform.tfstate
