name: SDD-Infra Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'specification/**'
      - 'policies/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  plan-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & CLI
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'v0.68.0'

      - name: Run Test Suite
        run: pytest tests/ -v

      - name: SDD Validate Specification
        run: sdd validate specification/infrastructure.yaml

      - name: SDD Plan & Policy Gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "meta-llama/llama-3.1-8b-instruct:free"
        run: sdd plan specification/infrastructure.yaml --json

      - name: Upload Terraform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-build-artifacts
          path: terraform/generated/

  apply:
    needs: plan-and-gate
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform-build-artifacts
          path: terraform/generated/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & CLI
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'v0.68.0'

      - name: SDD Deploy Infrastructure
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: sdd deploy specification/infrastructure.yaml --yes

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/generated/terraform.tfstate
