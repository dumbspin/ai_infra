[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-infra"
version = "2.0.0"
description = "Specification Driven Infrastructure Management CLI and Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "checkov>=3.2.0",
    "libsql>=0.1.0",
]

[project.scripts]
sdd = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
